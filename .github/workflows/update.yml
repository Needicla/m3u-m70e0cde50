name: Update Pluto TV (US) playlist

on:
  schedule:
    # every 6 hours; tokens live 24h so this has plenty of margin
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - generate.py
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: update-pluto-playlist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate playlist
        run: python generate.py

      # The playlist is ~1.4 MB of fresh tokens. Committing a new one every run
      # would add over a gigabyte per year, so we amend the single data commit
      # instead and keep the branch at "code commit + one data commit".
      - name: Publish playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pluto_us.m3u
          if git diff --cached --quiet; then
            echo "Playlist unchanged"
            exit 0
          fi
          git commit --amend --no-edit -m "Update Pluto TV US playlist"
          git push --force origin HEAD:main
